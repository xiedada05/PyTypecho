# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: PyTypecho

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.8, '3.10']
    
    services:
      typecho:
        # 1.2.0 has a server-side xmlrpc bug in wp.newCategory (fixed in 1.2.1,
        # typecho PR #1443), so the suite requires >= 1.2.1.
        # Note: metaWeblog.getPost / wp.getPage are broken server-side on
        # Typecho 1.3.0, so do not bump to a 1.3.x image until that is fixed.
        image: joyqi/typecho:1.2.1-php8.0-apache
        env:
          TYPECHO_DB_ADAPTER: Pdo_SQLite
          TYPECHO_INSTALL: 1
          TYPECHO_SITE_URL: http://127.0.0.1
          TYPECHO_USER_NAME: typecho
          TYPECHO_USER_PASSWORD: testpassword
        ports:
          - 80:80

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Test
      env:
        XMLRPC_URL: http://127.0.0.1/index.php/action/xmlrpc
        XMLRPC_USER_NAME: typecho
        XMLRPC_USER_PASSWORD: testpassword
      run: python -m unittest discover -s tests
